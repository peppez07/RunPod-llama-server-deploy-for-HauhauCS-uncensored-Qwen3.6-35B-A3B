name: Build llama-server CUDA image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile.llama-server
      - .github/workflows/build-llama-server-image.yml
  workflow_dispatch:
    inputs:
      llama_cpp_ref:
        description: "llama.cpp git ref to build (branch/tag/SHA)"
        default: master

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/llama-server-cuda

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        # The cudnn-devel base + build artifacts blow past the 14 GB free on
        # ubuntu-latest. This drops ~25 GB of unused tooling.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.llama-server
          push: true
          build-args: |
            LLAMA_CPP_REF=${{ inputs.llama_cpp_ref || 'master' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
