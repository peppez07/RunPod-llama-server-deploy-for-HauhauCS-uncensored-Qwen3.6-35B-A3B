name: Build Bonsai Prism CUDA image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      prism_release:
        description: "Optional Prism release tag (also supply its matching CUDA 12.8 archive SHA256)"
        required: false
        default: ""
      prism_sha256:
        description: "SHA256 for the selected Prism Linux CUDA 12.8 x64 archive"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests -v
      - run: python deploy_runpod.py launch --dry-run

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/bonsai-llama-server-cuda" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Optional Prism release
        id: runtime
        env:
          RELEASE: ${{ inputs.prism_release }}
          SHA256: ${{ inputs.prism_sha256 }}
        run: |
          if [ -n "$RELEASE" ] || [ -n "$SHA256" ]; then
            [[ "$RELEASE" =~ ^[A-Za-z0-9._-]+$ ]]
            [[ "$SHA256" =~ ^[A-Fa-f0-9]{64}$ ]]
            {
              echo "args<<EOF"
              echo "PRISM_RELEASE=$RELEASE"
              echo "PRISM_SHA256=$SHA256"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.llama-server
          platforms: linux/amd64
          load: true
          push: false
          build-args: ${{ steps.runtime.outputs.args }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test startup failure without credentials
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          set +e
          docker run --rm "$IMAGE:latest" > startup.log 2>&1
          code=$?
          set -e
          cat startup.log
          test "$code" -eq 1
          grep -q "Startup failed" startup.log
      - name: Publish validated image
        if: github.event_name != 'pull_request'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker push "$IMAGE:latest"
          docker push "$IMAGE:${{ github.sha }}"

